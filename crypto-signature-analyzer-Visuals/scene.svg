<rect x="0" y="200" width="1200" height="100" fill="#96988c"/>
<rect x="930" y="60" width="190" height="140" fill="#5b4030"/><polygon points="920,60 1130,60 1080,20 970,20" fill="#969a94"/>
<g fill="none" stroke="#e8eae4" stroke-width="5"><ellipse cx="1025" cy="16" rx="16" ry="7"><animate attributeName="cy" values="30;4" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0.15" dur="7s" repeatCount="indefinite"/></ellipse></g>
<g fill="#c4b294"><rect x="180" y="30" width="34" height="200"/><rect x="430" y="30" width="34" height="200"/><rect x="680" y="30" width="34" height="200"/></g>
<g fill="#c8cfc4" stroke="#2e2016" stroke-width="2"><rect x="222" y="130" width="40" height="48"/><rect x="472" y="130" width="40" height="48"/><rect x="722" y="130" width="40" height="48"/></g>

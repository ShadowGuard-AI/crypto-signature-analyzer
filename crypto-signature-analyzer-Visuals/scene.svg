<g><rect x="40" y="96" width="52" height="22" fill="#c8cfc4" stroke="#2e2016" stroke-width="3"/><circle cx="100" cy="150" r="9" fill="#a51f2d"><animate attributeName="r" values="4;11;11" dur="9s" repeatCount="indefinite"/><animate attributeName="cy" values="138;138;196" keyTimes="0;0.8;1" dur="9s" repeatCount="indefinite"/></circle><rect x="52" y="200" width="100" height="80" fill="#c8cfc4" stroke="#2e2016" stroke-width="3"><animate attributeName="opacity" values="1;1;0.35;1" keyTimes="0;0.86;0.9;1" dur="18s" repeatCount="indefinite"/></rect></g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="The grove in three depths: far, the shack and trunks with steam rising and thinning; middle, the bucket row where drops form at spiles at uneven rates, swell, and fall; near, the nearest spile and its drop, large and slow, swelling over a long count before it falls">
